<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: sidebar rail on desktop, bottom navigation on phone. Blue leads; green, pink and purple tag rooms and series. */

  --bg:#f3f6ff;--surf:#ffffff;--surf2:#e7edfb;--on:#171b26;--on2:#454c5f;--line:#c9d0e2;
  --pri:#0a5bd3;--onpri:#ffffff;--pric:#d6e3ff;--onpric:#001b3f;

  --warn:#ffb867;--warnc:#4a2c00;--err:#ffb4ab;--errc:#8c1d18;--lamp:#ffb74d;--lampc:#5a3500;
  --s1:#5a8bee;--s2:#36a262;--s3:#8f6de4;--s4:#e65d8c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220;--surf:#161b2c;--surf2:#222a40;--on:#e4e8f4;--on2:#adb5cc;--line:#384159;

  --pnk:#ffb0cf;--onpnk:#5e0b36;--pnkc:#7a1f4a;--onpnkc:#ffd9e6;
  --pur:#cfbdff;--onpur:#381a8a;--purc:#50309d;--onpurc:#e8deff;

.field.mono{font-family:'JetBrains Mono',monospace;font-size:14px}
label.lbl{display:block;font-size:12px;color:var(--on2)}label.lbl .field{margin-top:4px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;outline-offset:6px;background:linear-gradient(to right,var(--pri) var(--p,50%),var(--surf2) var(--p,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--pri);border:3px solid var(--surf);box-shadow:0 0 0 1px var(--pri)}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--pri);border:3px solid var(--surf)}
.bar{height:8px;border-radius:999px;background:var(--surf2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .4s}
.bulb{width:44px;height:44px;border-radius:14px;background:var(--surf2);color:var(--on2);display:grid;place-items:center;flex:none}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--surf);box-shadow:0 0 0 1px var(--line)}.dot.on{box-shadow:0 0 0 2px var(--on)}
.dis{opacity:.4;pointer-events:none}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.rain-cell{height:26px;border-radius:4px;background:var(--surf2)}.rain-cell.w{background:var(--pri)}
.hero{background:var(--pric);color:var(--onpric);border-color:transparent}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(8,12,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surf);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:28px}}
.fab{position:fixed;z-index:34;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(10,91,211,.35)}
@media (min-width:1024px){.fab{bottom:28px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--on);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
@media (min-width:1024px){#toast{bottom:32px}}
.tbl{width:100%;font-size:14px;border-collapse:collapse}.tbl th{font-weight:400;color:var(--on2);font-size:12px;text-align:right;padding:6px 0;border-bottom:1px solid var(--line)}.tbl th:first-child{text-align:left}
.tbl td{padding:6px 0;text-align:right;border-bottom:1px solid var(--surf2)}.tbl td:first-child{text-align:left}
.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important}}
</style>

      <div class="min-w-0 flex-1"><h1 id="pageTitle" class="text-lg font-medium leading-tight truncate">ภาพรวม</h1><p class="text-xs text-on2 leading-tight">อัปเดต <span data-b="upd" class="num font-mono">--:--:--</span></p></div>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const f=(n,d=0)=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='',fill)=>`<span class="ms${fill?' fill':''} ${c}" aria-hidden="true">${n}</span>`;
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tone=k=>`background:var(--${k}c);color:var(--on${k}c)`;
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.opacity=0,2400)};

/* ============ model ============ */
const ROOMS=[
 {id:'bedroom',name:'ห้องนอน',icon:'bed',k:'pur',base:27.5,hum:62,ac:true},
 {id:'bath',name:'ห้องน้ำ',icon:'bathtub',k:'pri',base:28.5,hum:76},
 {id:'living',name:'ห้องนั่งเล่น',icon:'weekend',k:'pnk',base:28.8,hum:60,ac:true},
 {id:'kitchen',name:'ห้องครัว',icon:'kitchen',k:'grn',base:30,hum:66},
 {id:'balcony',name:'ระเบียง',icon:'deck',k:'pri',base:31,hum:70,outdoor:true}
];
const SER={bath:'--s1',kitchen:'--s2',bedroom:'--s3',living:'--s4'};
const DASH={bath:[],kitchen:[7,4],bedroom:[2,3],living:[10,3,2,3]};
const TYPES={onoff:'เปิด/ปิด',dim:'หรี่แสงได้',rgb:'เปลี่ยนสีได้'};
const COLORS=[{n:'ขาวอุ่น',c:'#ffc78a'},{n:'ฟ้า',c:'#4d94ff'},{n:'เขียว',c:'#3ec97a'},{n:'ชมพู',c:'#ff6fa5'},{n:'ม่วง',c:'#9b6dff'}];
const KEY='smarthome.v2';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const S={
 lights:saved.lights||[
  {id:'l1',name:'ไฟเพดาน',room:'bedroom',type:'dim',on:true,bri:60,col:0,dev:'home/bedroom/light1'},
  {id:'l2',name:'ไฟหัวเตียง',room:'bedroom',type:'rgb',on:false,bri:40,col:3,dev:'home/bedroom/light2'},
  {id:'l3',name:'ไฟห้องน้ำ',room:'bath',type:'onoff',on:false,bri:100,col:0,dev:'home/bath/light1'},
  {id:'l4',name:'ไฟเพดาน',room:'living',type:'dim',on:true,bri:80,col:0,dev:'home/living/light1'},
  {id:'l5',name:'ไฟตกแต่ง',room:'living',type:'rgb',on:true,bri:50,col:4,dev:'home/living/light2'},
  {id:'l6',name:'ไฟครัว',room:'kitchen',type:'onoff',on:true,bri:100,col:0,dev:'home/kitchen/light1'},
  {id:'l7',name:'ไฟระเบียง',room:'balcony',type:'onoff',on:false,bri:100,col:0,dev:'home/balcony/light1'}],
 ac:saved.ac||{bedroom:{on:false,set:25,mode:'cool',fan:2},living:{on:true,set:26,mode:'cool',fan:2}},
 rules:saved.rules||[
  {id:'r1',c:'อุณหภูมิห้องนอนเกิน 29°C',a:'เปิดแอร์ห้องนอนที่ 25°C',on:true,k:'pur'},
  {id:'r2',c:'ฝนเริ่มตก',a:'ส่งแจ้งเตือนเข้า LINE',on:true,k:'pri'},
  {id:'r3',c:'ไม่มีคนในห้องนั่งเล่น 30 นาที',a:'ปิดไฟและแอร์ห้องนั่งเล่น',on:true,k:'pnk'},
  {id:'r4',c:'ถึงเวลา 23:00 ทุกวัน',a:'ปิดไฟทั้งหมด',on:false,k:'grn'},
  {id:'r5',c:'ไฟรวมเกิน 80% ของเบรกเกอร์',a:'ส่งแจ้งเตือนเข้า LINE',on:true,k:'pri'}],
 budget:saved.budget??1500,breaker:saved.breaker??30,ft:saved.ft??0.3972,svc:saved.svc??24.62,vat:saved.vat??7,
 mqtt:saved.mqtt||{url:'wss://broker.local:8884',prefix:'home'},
 range:'24h',page:'home',arg:null
};
S.live={meter:{watts:120,volts:230,amps:.6,pf:.85},rain:{raining:false,wet:4},
 rooms:Object.fromEntries(ROOMS.map(r=>[r.id,{t:r.base,h:r.hum,motion:r.id==='living',door:false}]))};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({lights:S.lights,ac:S.ac,rules:S.rules,budget:S.budget,breaker:S.breaker,ft:S.ft,svc:S.svc,vat:S.vat,mqtt:S.mqtt}))}catch(e){}};
const roomOf=id=>ROOMS.find(r=>r.id===id);
const lightsOn=rid=>S.lights.filter(l=>l.on&&(!rid||l.room===rid)).length;

/* ============ Api — แทนที่ส่วนนี้ด้วย MQTT / REST / WebSocket จริง ============
   hist(): [{t,kwh,temp,hum}] รายชั่วโมงย้อนหลัง 30 วัน (จากเซนเซอร์ที่ตู้เบรกเกอร์)
   subscribe(cb): cb({rooms:{id:{t,h,motion,door}}, rain:{raining,wet}, meter:{watts,volts,amps,pf}})
   send(cmd): ส่งคำสั่ง {type:'light'|'ac', ...} เช่น mqtt.publish(topic, payload) */
const Api={
 _h:null,
 hist(){
  if(this._h)return this._h;
  const H=3600e3,end=Math.floor(Date.now()/H)*H,out=[];let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=719;i>=0;i--){const t=end-i*H,h=new Date(t).getHours();
   const night=h>=21||h<6,eve=h>=17&&h<21,noon=h>=12&&h<16;
   const kwh=0.1+(night?0.55:0)+(eve?0.3:0)+(noon?0.15:0)+r()*0.12;
   const temp=night?25+r()*1.2:27+6*Math.sin((h-9)/24*2*Math.PI)+r()*.8;
   out.push({t,kwh:+kwh.toFixed(3),temp:+temp.toFixed(1),hum:Math.round(62+r()*12)})}
  return(this._h=out)},
 subscribe(cb){
  const step=()=>{
   const L=S.live,rooms={};
   ROOMS.forEach(r=>{const x=L.rooms[r.id],a=S.ac[r.id];
    const target=a&&a.on?(a.mode==='fan'?r.base-1:a.set):r.base;
    rooms[r.id]={t:x.t+(target-x.t)*(a&&a.on?.07:.015)+(Math.random()-.5)*.08,
     h:Math.max(40,Math.min(88,x.h+(Math.random()-.5)*.8+(r.hum-x.h)*.02)),
     motion:Math.random()<.06?!x.motion:x.motion,door:Math.random()<.03?!x.door:x.door}});
   const raining=L.rain.raining?Math.random()>.04:Math.random()<.025;
   const wet=Math.max(2,Math.min(96,L.rain.wet+(raining?10:-5)));
   let w=95;S.lights.forEach(l=>{if(l.on)w+=l.type==='onoff'?9:1+9*l.bri/100});
   let acOn=false;Object.entries(S.ac).forEach(([id,a])=>{if(a.on){acOn=true;w+=a.mode==='fan'?60:Math.max(250,450+(rooms[id].t-a.set)*120+a.fan*50)}});
   w+=(Math.random()-.5)*20;const v=229+Math.random()*3,pf=acOn?.92:.82;
   cb({rooms,rain:{raining,wet},meter:{watts:w,volts:v,amps:w/(v*pf),pf}})};
  step();return setInterval(step,2500)},
 send(c){console.log('cmd',c)}
};
const hist=Api.hist();

/* ============ bill ============ */
const TIERS=[[15,2.3488],[10,2.9882],[10,3.2405],[65,3.6237],[50,3.7171],[250,4.2218],[Infinity,4.4217]];
function bill(kwh){let left=kwh,from=1,rows=[],en=0;
 for(const[size,rate]of TIERS){const u=Math.min(left,size);rows.push({from,to:size===Infinity?null:from+size-1,u,rate,amt:u*rate});en+=u*rate;left-=u;from+=size;if(left<=0)break}
 const ft=kwh*S.ft,sub=en+ft+S.svc,vat=sub*S.vat/100;return{rows,en,ft,svc:S.svc,vat,total:sub+vat}}
function monthStats(){const n=new Date(),m=hist.filter(x=>{const d=new Date(x.t);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()});
 const kwh=m.reduce((a,x)=>a+x.kwh,0),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),el=(n.getDate()-1)+(n.getHours()+n.getMinutes()/60)/24;
 const today=hist.filter(x=>new Date(x.t).toDateString()===n.toDateString()).reduce((a,x)=>a+x.kwh,0);
 return{kwh,today,proj:kwh/Math.max(el,.25)*dim}}
function series(r){
 if(r==='24h'){const a=hist.slice(-24);return{labels:a.map(x=>new Date(x.t).getHours()+':00'),vals:a.map(x=>x.kwh),times:a.map(x=>x.t)}}
 const days=r==='7d'?7:30,map=new Map();hist.forEach(x=>{const k=new Date(x.t).toDateString();map.set(k,(map.get(k)||0)+x.kwh)});
 const a=[...map.entries()].slice(-days);
 return{labels:a.map(([k])=>new Date(k).toLocaleDateString('th-TH',{day:'numeric',month:'short'})),vals:a.map(([,v])=>+v.toFixed(2)),times:a.map(([k])=>new Date(k).getTime())}}
let avgRate=4;

const W=(k,v)=>$$(`[data-bw="${k}"]`).forEach(e=>e.style.width=Math.max(0,Math.min(100,v))+'%');
function roomStatus(r){const x=S.live.rooms[r.id];if(r.outdoor)return x.t>32?'ร้อนจัด':'อากาศปกติ';if(x.h>75)return'ชื้น';if(x.t>=30)return'ร้อน';if(x.t>=28)return'อุ่น';return'สบาย'}
function tickUI(){
 const L=S.live,m=L.meter,pct=m.watts/(S.breaker*m.volts)*100;
 B('watts',f(m.watts));B('amps',f(m.amps,1));B('volts',f(m.volts));B('pf',f(m.pf,2));B('load',f(pct));W('load',pct);
 B('lightsOn',lightsOn());B('lightsAll',S.lights.length);B('acOn',Object.values(S.ac).filter(a=>a.on).length);
 ROOMS.forEach(r=>{const x=L.rooms[r.id];B('t:'+r.id,f(x.t,1));B('h:'+r.id,f(x.h));B('occ:'+r.id,x.motion?'มีคน':'ไม่มีคน');B('door:'+r.id,x.door?'เปิด':'ปิด');B('st:'+r.id,roomStatus(r));B('lon:'+r.id,lightsOn(r.id))});
 B('wet',f(L.rain.wet));W('wet',L.rain.wet);
 B('upd',new Date().toLocaleTimeString('th-TH',{hour12:false}));
}
function fillBill(){
 const ms=monthStats(),b=bill(ms.proj),mtd=bill(ms.kwh);avgRate=b.total/Math.max(ms.proj,1);
 B('kwhToday',f(ms.today,1));B('kwhMonth',f(ms.kwh,1));B('billProj',f(b.total));B('billProj2',f(b.total,2));B('projKwh',f(ms.proj));B('mtdBill',f(mtd.total));B('effRate',f(avgRate,2));
 const pct=b.total/Math.max(S.budget,1)*100;B('budPct',f(pct));W('bud',pct);B('budLeft',f(Math.abs(S.budget-b.total)));
 const chip=$('#budChip');if(chip){const k=pct<80?['grnc','ongrnc','อยู่ในงบ','check_circle']:pct<100?['warnc','warn','ใกล้เกินงบ','warning']:['errc','err','เกินงบ','error'];
  chip.setAttribute('style',`background:var(--${k[0]});color:var(--${k[1]})`);chip.innerHTML=ic(k[3],'')+k[2]}
 const tb=$('#tierBody');if(tb)tb.innerHTML=b.rows.map(r=>`<tr><td>${r.from}–${r.to??'∞'}</td><td>${f(r.u,1)}</td><td>${f(r.rate,4)}</td><td>${f(r.amt,2)}</td></tr>`).join('')+
  `<tr class="text-on2"><td colspan="3">ค่า Ft</td><td>${f(b.ft,2)}</td></tr><tr class="text-on2"><td colspan="3">ค่าบริการ</td><td>${f(b.svc,2)}</td></tr><tr class="text-on2"><td colspan="3">VAT ${S.vat}%</td><td>${f(b.vat,2)}</td></tr><tr class="font-medium"><td colspan="3">รวม</td><td style="color:var(--pri)">${f(b.total,2)}</td></tr>`;
 fillSummary();
}
function fillSummary(){
 if(!$('#sTot'))return;const s=series(S.range),tot=s.vals.reduce((a,b)=>a+b,0),max=Math.max(...s.vals),i=s.vals.indexOf(max);
 B('sTot',f(tot,1));B('sCost',f(tot*avgRate));B('sPeak',f(max,2));B('sPeakAt',s.labels[i]);B('sAvg',f(tot/s.vals.length,2));
 B('sLbl',{'24h':'24 ชั่วโมงล่าสุด','7d':'7 วันล่าสุด','30d':'30 วันล่าสุด'}[S.range])}

const charts={};
function mk(id,cfg){const el=$('#'+id);if(!el)return;if(charts[id])charts[id].destroy();
 Chart.defaults.font.family='Prompt,sans-serif';Chart.defaults.color=cv('--on2');
 cfg.options=Object.assign({maintainAspectRatio:false,animation:false},cfg.options);charts[id]=new Chart(el,cfg)}
function killCharts(){Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]})}
const gridC=()=>({color:cv('--line')});
function drawUsage(){const s=series(S.range);
 mk('usageChart',{type:'bar',data:{labels:s.labels,datasets:[{data:s.vals,backgroundColor:cv('--pri'),borderRadius:4,borderSkipped:'bottom',maxBarThickness:22}]},
  options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${f(c.parsed.y,2)} kWh · ฿${f(c.parsed.y*avgRate,2)}`}}},
   scales:{x:{grid:{display:false},ticks:{maxTicksLimit:S.range==='30d'?8:12,maxRotation:0}},y:{beginAtZero:true,grid:gridC(),border:{display:false},title:{display:true,text:'kWh'}}}}});
 fillSummary()}
function spark(vals,h=64){const w=320,max=Math.max(...vals),pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-v/max*(h-12)]);
 const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px" aria-hidden="true"><path d="${d}L${w},${h}L0,${h}Z" fill="currentColor" opacity=".16"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

function buildNav(){

 $('#railNav').innerHTML=[...NAV,...MORE].map(n=>`<a href="#${n[0]}" class="rn ${rk(S.page)===n[0]?'on':''}">${ic(n[2],'',rk(S.page)===n[0])}${n[1]}</a>`).join('')}
function render(scroll){
 killCharts();
 const h=(location.hash||'#home').slice(1);let page=h,arg=null;
 if(h.startsWith('room-')){page='room';arg=h.slice(5);if(!roomOf(arg))page='rooms'}
 if(!R[page])page='home';
 S.page=page;S.arg=arg;
 $('#view').innerHTML=R[page](arg);
 $('#pageTitle').textContent=page==='room'?roomOf(arg).name:TITLE[page];
 buildNav();tickUI();fillBill();if(AFTER[page])AFTER[page](arg);
 if(scroll)window.scrollTo(0,0)}
addEventListener('hashchange',()=>render(true));

/* ============ theme ============ */
function themePref(){try{return localStorage.getItem('sh-theme')||'auto'}catch(e){return'auto'}}
function applyTheme(v){const r=document.documentElement;if(v==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',v);try{localStorage.setItem('sh-theme',v)}catch(e){}
 const dark=v==='dark'||(v==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);$('#themeIco').textContent=dark?'light_mode':'dark_mode'}
applyTheme(themePref());
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(themePref()==='auto'){applyTheme('auto');render(false)}});
$('#themeBtn').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);applyTheme(dark?'light':'dark');render(false)};

/* ============ sheets ============ */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;const i=$('#sheetBody input,#sheetBody select');i&&i.focus()}
function closeSheet(){$('#sheet').hidden=true}
let newType='dim';
function addLightSheet(room){newType='dim';
 openSheet(`<h2 class="text-lg font-medium mb-4">เพิ่มหลอดไฟ</h2>
 <label class="lbl">ชื่อหลอดไฟ<input class="field" id="nl-name" placeholder="เช่น ไฟข้างโต๊ะ" maxlength="40"></label>
 <label class="lbl mt-3">ห้อง<select class="field" id="nl-room">${ROOMS.map(r=>`<option value="${r.id}" ${r.id===room?'selected':''}>${r.name}</option>`).join('')}</select></label>
 <div class="mt-3 text-xs text-on2 mb-1">ชนิดหลอด</div>
 <div class="seg" id="nl-type">${Object.entries(TYPES).map(([k,v])=>`<button data-act="nltype" data-t="${k}" class="${k===newType?'on':''}">${v}</button>`).join('')}</div>
 <label class="lbl mt-3">รหัสอุปกรณ์ / MQTT topic<input class="field mono" id="nl-dev" placeholder="${esc(S.mqtt.prefix)}/ห้อง/light3"></label>
 <p class="text-xs mt-3" id="nl-err" style="color:var(--err)" hidden></p>
 <div class="flex gap-2 mt-5"><button class="btn btn-out flex-1" data-act="closesheet">ยกเลิก</button><button class="btn btn-fill flex-1" data-act="nlsave">บันทึก</button></div>`)}
function addRuleSheet(){openSheet(`<h2 class="text-lg font-medium mb-4">เพิ่มกฎอัตโนมัติ</h2>
 <label class="lbl">ถ้า<select class="field" id="nr-c">${COND.map(c=>`<option>${c}</option>`).join('')}</select></label>
 <label class="lbl mt-3">ให้<select class="field" id="nr-a">${ACT.map(c=>`<option>${c}</option>`).join('')}</select></label>
 <div class="flex gap-2 mt-5"><button class="btn btn-out flex-1" data-act="closesheet">ยกเลิก</button><button class="btn btn-fill flex-1" data-act="nrsave">บันทึก</button></div>`)}

/* ============ actions ============ */
const sendL=l=>Api.send({type:'light',dev:l.dev,on:l.on,bri:l.bri,col:l.col});
const sendA=id=>Api.send({type:'ac',room:id,...S.ac[id]});
const swap=(id,html)=>{const e=$('#'+id);if(e)e.outerHTML=html};
function applyScene(id){
 if(id==='away'){S.lights.forEach(l=>l.on=false);Object.values(S.ac).forEach(a=>a.on=false)}
 if(id==='sleep'){S.lights.forEach(l=>l.on=false);const b=S.lights.find(l=>l.room==='bedroom'&&l.type!=='onoff');if(b){b.on=true;b.bri=10}S.ac.bedroom.on=true;S.ac.bedroom.set=25}
 if(id==='movie'){S.lights.forEach(l=>l.on=false);S.lights.filter(l=>l.room==='living'&&l.type!=='onoff').forEach(l=>{l.on=true;l.bri=20})}
 if(id==='all'){S.lights.forEach(l=>l.on=true)}
 S.lights.forEach(sendL);Object.keys(S.ac).forEach(sendA);save()}
async function exportData(fmt){
 const s=series(S.range),rows=s.vals.map((v,i)=>({time:new Date(s.times[i]).toISOString(),label:s.labels[i],kwh:v,est_cost_thb:+(v*avgRate).toFixed(2)}));
 const name=`power-${S.range}-${new Date().toISOString().slice(0,10)}.${fmt}`;
 const data=fmt==='csv'?'﻿'+'time,label,kwh,est_cost_thb\n'+rows.map(r=>`${r.time},${r.label},${r.kwh},${r.est_cost_thb}`).join('\n'):JSON.stringify(rows,null,2);
 let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:name,data});toast('ส่งออกแล้ว '+name)}catch(e){if(!e||e.code!=='declined')toast('ส่งออกไม่สำเร็จ')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('ส่งออกแล้ว '+name)}

document.addEventListener('click',e=>{
 if(e.target.id==='sheet'){closeSheet();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id,l=S.lights.find(x=>x.id===id);
 if(a==='lt'&&l){l.on=!l.on;sendL(l);save();swap('lc-'+id,lightCard(l));tickUI()}
 else if(a==='col'&&l){l.col=+b.dataset.i;sendL(l);save();swap('lc-'+id,lightCard(l))}
 else if(a==='del'&&l){if(b.dataset.armed){S.lights=S.lights.filter(x=>x.id!==id);save();render(false);toast('ลบ '+l.name+' แล้ว')}
  else{b.dataset.armed='1';b.textContent='แตะอีกครั้งเพื่อลบ';b.style.color='var(--err)';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='ลบ';b.style.color=''}},3000)}}
 else if(a==='alloff'){S.lights.forEach(x=>x.on=false);S.lights.forEach(sendL);save();render(false);toast('ปิดไฟทั้งหมดแล้ว')}
 else if(a==='scene'){applyScene(id);render(false);toast('ใช้ฉาก “'+SCENES.find(s=>s.id===id).n+'”')}
 else if(a==='acp'){S.ac[id].on=!S.ac[id].on;sendA(id);save();swap('ac-'+id,acCard(id));tickUI()}
 else if(a==='act'){const x=S.ac[id];x.set=Math.max(16,Math.min(30,x.set+ +b.dataset.d));sendA(id);save();swap('ac-'+id,acCard(id));tickUI()}
 else if(a==='mode'){S.ac[id].mode=b.dataset.m;sendA(id);save();swap('ac-'+id,acCard(id));tickUI()}
 else if(a==='fan'){S.ac[id].fan=+b.dataset.f;sendA(id);save();swap('ac-'+id,acCard(id));tickUI()}
 else if(a==='range'){S.range=b.dataset.r;$$('#rangeSeg button').forEach(x=>x.classList.toggle('on',x===b));drawUsage()}
 else if(a==='export')exportData(b.dataset.fmt);
 else if(a==='addlight')addLightSheet(b.dataset.room);
 else if(a==='nltype'){newType=b.dataset.t;$$('#nl-type button').forEach(x=>x.classList.toggle('on',x===b))}
 else if(a==='nlsave'){const n=$('#nl-name').value.trim(),room=$('#nl-room').value,err=$('#nl-err');
  if(!n){err.textContent='ใส่ชื่อหลอดไฟก่อน';err.hidden=false;$('#nl-name').focus();return}
  const cnt=S.lights.filter(x=>x.room===room).length+1,nl={id:'l'+Date.now().toString(36),name:n,room,type:newType,on:true,bri:70,col:0,dev:$('#nl-dev').value.trim()||`${S.mqtt.prefix}/${room}/light${cnt}`};
  S.lights.push(nl);sendL(nl);save();closeSheet();render(false);toast('เพิ่ม '+n+' แล้ว')}
 else if(a==='closesheet')closeSheet();
 else if(a==='rule'){const r=S.rules.find(x=>x.id===id);r.on=!r.on;save();b.setAttribute('aria-checked',r.on)}
 else if(a==='delrule'){S.rules=S.rules.filter(x=>x.id!==id);save();render(false)}
 else if(a==='addrule')addRuleSheet();
 else if(a==='nrsave'){S.rules.push({id:'r'+Date.now().toString(36),c:$('#nr-c').value,a:$('#nr-a').value,on:true,k:['pri','grn','pnk','pur'][S.rules.length%4]});save();closeSheet();render(false);toast('เพิ่มกฎแล้ว')}
 else if(a==='savemq'){S.mqtt={url:$('#mq-url').value.trim(),prefix:$('#mq-pre').value.trim()||'home'};save();toast('บันทึกการเชื่อมต่อแล้ว')}
 else if(a==='theme'){applyTheme(b.dataset.v);render(false)}
});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.act;
 if(a==='bri'){const l=S.lights.find(x=>x.id===t.dataset.id);l.bri=+t.value;t.style.setProperty('--p',t.value+'%');const s=$(`[data-bri="${l.id}"]`);if(s)s.textContent=t.value+'%'}
 else if(a==='acr'){const x=S.ac[t.dataset.id];x.set=+t.value;t.style.setProperty('--p',(t.value-16)/14*100+'%');const c=t.closest('.card'),big=c.querySelector('.text-5xl');if(big)big.firstChild.textContent=t.value}
 else if(t.dataset.in){const v=parseFloat(t.value);if(isFinite(v)){S[t.dataset.in]=v;save();fillBill();if(t.dataset.in==='breaker')tickUI()}}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
 if(a==='bri'){const l=S.lights.find(x=>x.id===t.dataset.id);sendL(l);save()}
 else if(a==='acr'){sendA(t.dataset.id);save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ============ boot ============ */
function onData(d){const flip=d.rain.raining!==S.live.rain.raining;S.live=d;
 if(flip&&['home','weather'].includes(S.page)&&$('#sheet').hidden)render(false);else tickUI()}
render(true);
Api.subscribe(onData);
</script>

</body></html>
